<!doctype html><html lang="de"><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Mission 2 · Hebel-Detektive</title><style>body{margin:0;background:#050914;color:#f2f7ff;font:17px system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.panel{background:#0b1226;border:1px solid #1e3a5f;border-radius:24px;padding:32px;margin-top:25px}.eyebrow{color:#4cc9ff;font-size:12px;font-weight:bold;letter-spacing:.14em}.task{line-height:1.7}.objects{display:block;width:100%;height:auto;max-height:none;object-fit:contain;border-radius:14px;margin:22px 0;border:1px solid #315b8f;background:#071126}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:25px 0}.choice{padding:16px;border:1px solid #1e3a5f;border-radius:14px;background:#0e1c35}.choice label{font-weight:bold}.choice select{display:block;width:100%;padding:16px 12px;margin-top:8px;background:#050914;color:#f2f7ff;border:1px solid #315b8f;border-radius:8px;font-size:16px}.btn{border:0;border-radius:99px;padding:13px 20px;background:#4cc9ff;color:#050914;font-weight:900;cursor:pointer}.next{display:none;background:#38bdf8;margin-top:12px}.feedback{color:#4cc9ff;min-height:25px;margin-top:15px}@media(max-width:650px){.choices{grid-template-columns:1fr}}</style><body><main class="wrap"><a href="index.html#board" style="color:#38bdf8">← zurück zum Missionsboard</a><section class="panel"><div class="eyebrow">MISSION 02 · HEBEL-DETEKTIVE</div><h1>Welche Hebelart ist es?</h1><div class="task"><strong>Ordnet die vier Gegenstände einem einseitigen oder zweiseitigen Hebel zu:</strong><br>Pinzette, Schere, Nussknacker und Angel.<br><br><strong>Frage: Welche Hebelart liegt bei jedem Gegenstand vor?</strong></div><img class="objects" src="assets/hebeldetektive.png" alt="Realistische Darstellung von Pinzette, Schere, Nussknacker und Angel"><div class="choices"><div class="choice"><label>Pinzette<select id="pinzette"><option value="">Hebelart wählen</option><option value="einseitig">einseitiger Hebel</option><option value="zweiseitig">zweiseitiger Hebel</option></select></label></div><div class="choice"><label>Schere<select id="schere"><option value="">Hebelart wählen</option><option value="einseitig">einseitiger Hebel</option><option value="zweiseitig">zweiseitiger Hebel</option></select></label></div><div class="choice"><label>Nussknacker<select id="nussknacker"><option value="">Hebelart wählen</option><option value="einseitig">einseitiger Hebel</option><option value="zweiseitig">zweiseitiger Hebel</option></select></label></div><div class="choice"><label>Angel<select id="angel"><option value="">Hebelart wählen</option><option value="einseitig">einseitiger Hebel</option><option value="zweiseitig">zweiseitiger Hebel</option></select></label></div></div><button class="btn" id="check">Zuordnung prüfen</button><div class="feedback" id="feedback"></div><button class="btn next" id="next">Weiter zum Missionsboard →</button></section></main><script>check.onclick=()=>{let ok=pinzette.value==='einseitig'&&schere.value==='zweiseitig'&&nussknacker.value==='einseitig'&&angel.value==='einseitig';feedback.textContent=ok?'Richtig! Alle Zuordnungen stimmen.':'Falsch. Versucht es erneut.';if(ok){localStorage.setItem('mission2Solved','true');check.disabled=true;next.style.display='inline-block'}};next.onclick=()=>location.href='index.html#board';</script><script src="quick-round.js"></script></body></html>
