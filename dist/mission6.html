<!doctype html><html lang="de"><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Mission 6 · Wahr oder falsch?</title><style>body{margin:0;background:#050914;color:#f2f7ff;font:16px system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between}.top a{color:#38bdf8}.panel{background:#0b1226;border:1px solid #1e3a5f;border-radius:24px;padding:30px;margin-top:22px}.eyebrow{color:#4cc9ff;font-size:12px;letter-spacing:.14em;font-weight:900}.statement{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;background:#0e1c35;border:1px solid #1e3a5f;border-radius:14px;padding:16px;margin:12px 0}.choices{display:flex;gap:8px}.choice{padding:9px 13px;border:1px solid #315b8f;border-radius:8px;background:#050914;color:#f2f7ff;font-weight:bold;cursor:pointer}.choice.selected{border-color:#4cc9ff;background:#12305a;box-shadow:0 0 10px rgba(76,201,255,.3)}.submit{border:0;border-radius:99px;padding:14px 22px;background:#4cc9ff;color:#050914;font-weight:900;cursor:pointer;margin-top:18px}.feedback{color:#4cc9ff;min-height:28px;margin-top:15px}.success{display:none;background:#102a52;color:#4cc9ff;font:30px Georgia;padding:28px;border-radius:18px;margin-top:25px;text-align:center}@media(max-width:700px){.statement{grid-template-columns:1fr}.choices{justify-content:flex-start}}
</style><body><header class="wrap top"><b>PHYSIK <span style="color:#4cc9ff">·</span> MYSTERY LAB</b><a href="index.html#board">← zurück zum Missionsboard</a></header><main class="wrap"><section class="panel"><div class="eyebrow">MISSION 06 · ABSCHLUSSCHECK</div><h1>Wahr oder falsch?</h1><p>Wählt zu jeder Aussage eine Antwort. Erst mit „Antwort einloggen“ wird eure gesamte Lösung geprüft.</p><section id="list"></section><button class="submit" id="submit">Antwort einloggen</button><div class="feedback" id="feedback"></div><div class="success" id="success">Mission erfolgreich!<br><small>Alle 10 Aussagen sind richtig.</small></div></section></main><script>const data=[['Je länger der Kraftarm ist, desto weniger Kraft benötigt man bei gleicher Last und gleichem Lastarm.',true],['Bei einem Hebel im Gleichgewicht müssen auf beiden Seiten gleich große Kräfte wirken.',false],['Ein Hebel kann sich im Gleichgewicht befinden, obwohl die Hebelarme unterschiedlich lang sind.',true],['Wird der Kraftarm verdoppelt, benötigt man bei unveränderter Last nur die halbe Kraft.',true],['Je näher die Last am Drehpunkt liegt, desto größer muss die aufgewendete Kraft sein.',false],['Mit einem Hebel kann man Kraft sparen, muss dafür aber einen längeren Weg zurücklegen.',true],['Bei einem einseitigen Hebel liegen Kraftarm und Lastarm auf gegenüberliegenden Seiten des Drehpunkts.',false],['Eine Schere ist ein Beispiel für einen zweiseitigen Hebel.',true],['Ein Nussknacker benötigt weniger Handkraft, wenn man möglichst nah am Drehpunkt drückt.',false],['Ein Hebel kann die benötigte Kraft verringern, aber keine Energie erzeugen.',true]];const list=document.getElementById('list');data.forEach((item,i)=>{const row=document.createElement('div');row.className='statement';row.innerHTML='<span><b>'+String(i+1).padStart(2,'0')+'</b> · '+item[0]+'</span><span class="choices"><button class="choice" data-v="true">Richtig</button><button class="choice" data-v="false">Falsch</button></span>';row.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{row.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});list.appendChild(row)});document.getElementById('submit').onclick=()=>{const rows=[...document.querySelectorAll('.statement')],wrong=rows.filter((r,i)=>{const selected=r.querySelector('.selected');return !selected||selected.dataset.v!==String(data[i][1])}).length;const f=document.getElementById('feedback');if(wrong===0){f.textContent='Alle Antworten sind richtig!';document.getElementById('success').style.display='none';const go=document.createElement('button');go.textContent='Weiter zum Dashboard →';go.style.cssText='margin-top:18px;padding:14px 22px;border:0;border-radius:99px;background:#38bdf8;color:#050914;font-weight:900;cursor:pointer';go.onclick=()=>location.href='index.html';document.querySelector('.panel').appendChild(go);document.getElementById('submit').disabled=true;localStorage.setItem('mission6Solved','true')}else f.textContent=wrong+' von 10 falsch. Ändert eure Antworten und loggt sie erneut ein.'};</script></body></html>
